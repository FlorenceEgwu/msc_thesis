# Global defaults (overridable per dataset and per sample)
defaults:
  mapper: "STAR"              # STAR or HISAT2
  threads: 8
  strandedness: "auto"        # auto, unstranded, forward, reverse
  trim: false
  star:
    sjdbOverhang: 100
    outFilterMismatchNoverLmax: 0.03
    outSAMtype: ["BAM", "SortedByCoordinate"]
    twopassMode: "Basic"      # Basic or None
  hisat2:
    knownSplicesiteFile: null
    score_min: "L,0,-0.2"

# Datasets (group-level defaults + references + overrides)
datasets:
  mouse_bulk_chr19:
    organism: "mouse"
    ref: "reference/chr19_4300000-4800000.fa"
    gtf: "reference/chr19_4300000-4800000_fixed.gtf"
    star_index_dir: "reference/star_index_chr19_window"
    hisat2_index_prefix: "reference/hisat2_index/chr19_4300000-4800000"
    defaults:
      mapper: "HISAT2"
      hisat2:
        score_min: "L,0,-0.4"

# Output locations
outdir: "results"
tmpdir: "tmp"

# QC/AS toggles
qc:
  fastqc: true
  multiqc: true
as:
  enabled: false
  tool: rmats
  design_tsv: "design.tsv"   # sample-to-condition map (see below)
  read_length: 101           # required for rmats
  library_type: "fr-firststrand"   # fr-firststrand | fr-secondstrand | unstranded

simulate:
  enabled: false
  per_dataset:
    mouse_bulk_chr19:
      n_samples: 2
      reads_per_sample: 1000000
      read_length: 101
      paired_end: true
      outdir: "data/sim/mouse_bulk_chr19"
      transcript_fa: "reference/chr19_4300000-4800000.fa"

stringtie:
  bin_dir: "~/pl0296-02/project_data/stringtie"
  gtf: "reference/chr19_4300000-4800000_fixed.gtf"
