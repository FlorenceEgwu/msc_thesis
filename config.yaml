tools:
  star_dir: "~/pl0296-02/project_data/STAR-2.7.11b/source"
  hisat2_dir: "~/pl0296-02/project_data/hisat2-2.2.1"
  samtools_dir: "~/pl0296-02/project_data/samtools-1.19.2"
  stringtie_dir: "~/pl0296-02/project_data/stringtie"
  Miniforge3: "~/pl0296-02/project_data/miniforge3"
  rmats_bin: "~/pl0296-02/project_data/miniforge3/bin/rmats.py"
  suppa2_bin: "~/pl0296-02/project_data/miniforge3/bin/suppa.py"
  python_bin: "python"

ground_truth:
  complex_exon_threshold: 2

as_events:
  datasets:
    - sim_mouse_dataset2
    - sim_mouse_dataset3

rmats:
  enabled: true
  datasets:
    - sim_mouse_dataset2
    - sim_mouse_dataset3
  condition_a:
    name: Cond1
    sample_ids: [1, 2, 3, 4, 5]
  condition_b:
    name: Cond2
    sample_ids: [6, 7, 8, 9, 10]
  threads: 8
  read_length: 100
  lib_type: fr-unstranded
  paired_stats: false
  fdr: 0.05
  min_abs_inc_level_difference: 0.0
  novel_ss: false
  variable_read_length: false
  truth_table: ""
